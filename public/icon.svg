<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#881337" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Playful dancing circles / rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 16" opacity="0.35" />
  <circle cx="256" cy="256" r="140" fill="#ffffff" opacity="0.2" />

  <!-- Center Golden Dancing Star Character with Smile & Big Cute Eyes -->
  <g filter="url(#shadow)">
    <!-- Star Points -->
    <path d="M 256 95 L 295 195 L 402 203 L 320 274 L 345 380 L 256 324 L 167 380 L 192 274 L 110 203 L 217 195 Z" fill="#fde047" stroke="#eab308" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Big Sparkling Cartoon Eyes -->
    <!-- Left Eye -->
    <ellipse cx="225" cy="245" rx="16" ry="22" fill="#1e1b4b" />
    <circle cx="230" cy="238" r="7" fill="#ffffff" />
    <circle cx="220" cy="252" r="3" fill="#ffffff" />

    <!-- Right Eye -->
    <ellipse cx="287" cy="245" rx="16" ry="22" fill="#1e1b4b" />
    <circle cx="292" cy="238" r="7" fill="#ffffff" />
    <circle cx="282" cy="252" r="3" fill="#ffffff" />

    <!-- Rosy Blush Cheeks -->
    <circle cx="202" cy="265" r="12" fill="#f43f5e" opacity="0.6" />
    <circle cx="310" cy="265" r="12" fill="#f43f5e" opacity="0.6" />

    <!-- Cheerful Open Smiling Mouth -->
    <path d="M 235 272 Q 256 302 277 272 Z" fill="#991b1b" stroke="#7f1d1d" stroke-width="2" />
    <path d="M 244 286 Q 256 298 268 286 Z" fill="#fb7185" />
  </g>

  <!-- Musical Notes Floating -->
  <g fill="#ffffff" opacity="0.95">
    <!-- Note 1 -->
    <circle cx="120" cy="140" r="14" />
    <rect x="130" y="90" width="6" height="50" rx="3" />
    <path d="M 136 90 Q 155 85 160 105 L 160 115 Q 148 100 136 102 Z" />

    <!-- Note 2 -->
    <circle cx="390" cy="130" r="14" />
    <rect x="400" y="80" width="6" height="50" rx="3" />
    <path d="M 406 80 Q 425 75 430 95 L 430 105 Q 418 90 406 92 Z" />
  </g>
</svg>
